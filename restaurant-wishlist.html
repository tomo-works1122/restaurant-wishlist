<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行きたいお店リスト</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --surface2: #F5EFE6;
    --border: #E2D5C3;
    --accent: #8B5E3C;
    --accent2: #6B4423;
    --accent-light: #F0E8DE;
    --text: #3D2B1F;
    --text-muted: #9B8070;
    --visited-color: #5C8A5C;
    --unvisited-color: #8B5E3C;
    --danger: #C0392B;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(100,60,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    font-weight: 400;
  }

  /* ── ヘッダー ── */
  header {
    background: #FFFFFF;
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 8px rgba(100,60,20,0.06);
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.06em;
  }
  header h1 span {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    color: var(--text-muted);
    margin-left: 12px;
    font-weight: 400;
    letter-spacing: 0.1em;
  }

  .stats {
    display: flex;
    gap: 20px;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }
  .stats b {
    color: var(--accent);
    font-size: 22px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    display: block;
    margin-bottom: 2px;
  }

  /* ── メインレイアウト ── */
  .container { max-width: 900px; margin: 0 auto; padding: 28px 20px; }

  /* ── ボタン行 ── */
  .btn-row { display: flex; gap: 10px; margin-bottom: 12px; }

  .add-btn {
    flex: 1;
    padding: 12px;
    background: var(--accent-light);
    color: var(--accent);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .add-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .search-btn {
    background: #fff;
    color: var(--text-muted);
    border-color: var(--border);
  }
  .search-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .recommend-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #8B5E3C 0%, #A0703F 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 28px;
    transition: opacity 0.2s;
    box-shadow: 0 3px 12px rgba(139,94,60,0.3);
  }
  .recommend-btn:hover { opacity: 0.88; }

  /* ── フィルター ── */
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .filter-btn {
    padding: 7px 18px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    background: #fff;
    color: var(--text-muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
  }

  .search-input {
    width: 100%;
    padding: 11px 16px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.2s;
    box-shadow: var(--shadow);
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); }

  /* ── カードリスト ── */
  .card-list { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(139,94,60,0.15); }
  .card-photos {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    height: 130px;
  }
  .card-photos::-webkit-scrollbar { display: none; }
  .card-photos img { width: 160px; height: 130px; object-fit: cover; flex-shrink: 0; }
  .card-content {
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .card.visited { border-left: 4px solid var(--visited-color); }
  .card.unvisited { border-left: 4px solid var(--unvisited-color); }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 7px;
    flex-shrink: 0;
  }
  .status-dot.visited { background: var(--visited-color); }
  .status-dot.unvisited { background: var(--unvisited-color); }

  .card-body { flex: 1; min-width: 0; }
  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 19px;
    margin-bottom: 6px;
    color: var(--text);
  }
  .card-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    background: var(--accent-light);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--accent2);
  }
  .card-memo { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.7; }

  .card-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  .action-btn {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .action-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .action-btn.del:hover { border-color: var(--danger); color: var(--danger); background: #fdf0ef; }

  /* ── モーダル ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(60,30,10,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #FFFCF8;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(100,60,20,0.18);
  }
  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  input[type=text], textarea, select {
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: #fff; }

  .modal-btns { display: flex; gap: 10px; margin-top: 24px; }
  .btn-primary {
    flex: 1;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-cancel {
    padding: 12px 20px;
    background: #fff;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { border-color: var(--text-muted); color: var(--text); }

  /* ── 地図モーダル ── */
  #map-modal .modal { max-width: 640px; }
  #map-frame { width: 100%; height: 400px; border: none; margin-top: 12px; border-radius: 8px; }

  /* ── 検索結果 ── */
  #search-modal .modal { max-width: 560px; }
  #recommend-modal .modal { max-width: 560px; }
  .search-results-list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .search-result-item {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow);
  }
  .search-result-item:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(139,94,60,0.15); }
  .search-result-photos {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    height: 110px;
    background: var(--surface2);
  }
  .search-result-photos::-webkit-scrollbar { display: none; }
  .search-result-photos img { width: 130px; height: 110px; object-fit: cover; flex-shrink: 0; }
  .search-result-no-photo {
    width: 100%;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    background: var(--accent-light);
  }
  .search-result-body { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .search-result-info { flex: 1; min-width: 0; }
  .search-result-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 17px;
    margin-bottom: 4px;
    color: var(--text);
  }
  .search-result-addr { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .search-result-rating { font-size: 12px; color: var(--accent2); font-weight: 500; }
  .search-loading { text-align: center; color: var(--text-muted); padding: 28px; font-size: 13px; }

  /* 空リスト */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 2.5;
  }
  .empty .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.5; }
</style>
</head>
<body>

<header>
  <h1>🍽 Wishlist <span>行きたいお店</span></h1>
  <div class="stats">
    <div><b id="stat-total">0</b><br>登録</div>
    <div><b id="stat-visited" style="color:var(--visited-color)">0</b><br>訪問済</div>
    <div><b id="stat-unvisited">0</b><br>未訪問</div>
  </div>
</header>

<div class="container">
  <div class="btn-row">
    <button class="add-btn" onclick="openAdd()">＋ 手動で追加</button>
    <button class="add-btn search-btn" onclick="openSearch()">🔍 お店を検索して追加</button>
  </div>
  <button class="recommend-btn" onclick="openRecommend()">✨ 東京・神奈川の人気店おすすめ</button>

  <input class="search-input" type="text" placeholder="🔍 店名・エリア・ジャンルで検索..." id="search" oninput="render()">

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">すべて</button>
    <button class="filter-btn" data-filter="unvisited" onclick="setFilter('unvisited',this)">未訪問</button>
    <button class="filter-btn" data-filter="visited" onclick="setFilter('visited',this)">訪問済</button>
  </div>

  <div class="card-list" id="list"></div>
</div>

<!-- 追加/編集モーダル -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 id="modal-title">お店を追加</h2>
    <div class="form-group">
      <label>店名 *</label>
      <input type="text" id="f-name" placeholder="例：焼肉の名門 天壇">
    </div>
    <div class="form-group">
      <label>ジャンル</label>
      <input type="text" id="f-genre" placeholder="例：焼肉、イタリアン、ラーメン">
    </div>
    <div class="form-group">
      <label>エリア</label>
      <input type="text" id="f-area" placeholder="例：岡山駅前、表参道">
    </div>
    <div class="form-group">
      <label>ステータス</label>
      <select id="f-status">
        <option value="unvisited">未訪問（行きたい）</option>
        <option value="visited">訪問済</option>
      </select>
    </div>
    <div class="form-group">
      <label>メモ</label>
      <textarea id="f-memo" placeholder="気になるメニュー、予算、一緒に行きたい人など…"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('edit-modal')">キャンセル</button>
      <button class="btn-primary" onclick="save()">保存</button>
    </div>
  </div>
</div>

<!-- 地図モーダル -->
<div class="modal-overlay" id="map-modal">
  <div class="modal">
    <h2 id="map-title">地図で確認</h2>
    <iframe id="map-frame" allowfullscreen loading="lazy"></iframe>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('map-modal')">閉じる</button>
    </div>
  </div>
</div>

<!-- おすすめモーダル -->
<div class="modal-overlay" id="recommend-modal">
  <div class="modal">
    <h2>✨ 人気おすすめ</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">東京・神奈川エリアの⭐4.0以上・評価500件以上の人気店をランダム表示</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('recommend-modal')">閉じる</button>
      <button class="btn-primary" onclick="loadRecommendations()">🔀 シャッフル</button>
    </div>
    <div id="recommend-results"></div>
  </div>
</div>

<!-- お店検索モーダル -->
<div class="modal-overlay" id="search-modal">
  <div class="modal">
    <h2>🔍 お店を検索して追加</h2>
    <div class="form-group">
      <label>エリア</label>
      <input type="text" id="s-area" placeholder="例：岡山駅前、表参道、渋谷">
    </div>
    <div class="form-group">
      <label>ジャンル</label>
      <input type="text" id="s-genre" placeholder="例：焼肉、イタリアン、ラーメン">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('search-modal')">キャンセル</button>
      <button class="btn-primary" onclick="searchPlaces()">検索</button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'restaurant_wishlist_v1';
const PLACES_API_KEY = 'AIzaSyD0gLLyVr9QU9mGImXpA0eQ-k_vedGbEOQ';
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editId = null;
let currentFilter = 'all';

function save() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('店名を入力してください'); return; }
  const item = {
    id: editId || Date.now().toString(),
    name,
    genre: document.getElementById('f-genre').value.trim(),
    area: document.getElementById('f-area').value.trim(),
    status: document.getElementById('f-status').value,
    memo: document.getElementById('f-memo').value.trim(),
    createdAt: editId ? (items.find(i=>i.id===editId)?.createdAt || Date.now()) : Date.now()
  };
  if (editId) {
    items = items.map(i => i.id === editId ? item : i);
  } else {
    items.unshift(item);
  }
  persist(); closeModal('edit-modal'); render();
}

function deleteItem(id) {
  if (!confirm('削除しますか？')) return;
  items = items.filter(i => i.id !== id);
  persist(); render();
}

function toggleStatus(id) {
  items = items.map(i => i.id === id ? {...i, status: i.status==='visited' ? 'unvisited' : 'visited'} : i);
  persist(); render();
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function openAdd() {
  editId = null;
  document.getElementById('modal-title').textContent = 'お店を追加';
  ['f-name','f-genre','f-area','f-memo'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value = 'unvisited';
  openModal('edit-modal');
}

function openEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'お店を編集';
  document.getElementById('f-name').value = item.name;
  document.getElementById('f-genre').value = item.genre;
  document.getElementById('f-area').value = item.area;
  document.getElementById('f-status').value = item.status;
  document.getElementById('f-memo').value = item.memo;
  openModal('edit-modal');
}

const RECOMMEND_QUERIES = [
  '東京 人気 レストラン グルメ',
  '渋谷 話題 飲食店',
  '新宿 人気 レストラン',
  '恵比寿 人気 ダイニング',
  '銀座 話題 レストラン',
  '表参道 人気 レストラン',
  '中目黒 話題 レストラン',
  '六本木 人気 レストラン',
  '横浜 話題 グルメ',
  '川崎 人気 飲食店',
  '鎌倉 人気 レストラン',
  '吉祥寺 人気 飲食店',
  '下北沢 話題 レストラン',
];

function openRecommend() {
  document.getElementById('recommend-results').innerHTML = '';
  openModal('recommend-modal');
  loadRecommendations();
}

async function loadRecommendations() {
  const resultDiv = document.getElementById('recommend-results');
  resultDiv.innerHTML = '<div class="search-loading">✨ おすすめを探しています...</div>';

  // クエリをシャッフルして3つ選んで同時に検索
  const shuffled = RECOMMEND_QUERIES.slice().sort(() => Math.random() - 0.5);
  const selectedQueries = shuffled.slice(0, 3);

  const fetchOne = (query) => fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': PLACES_API_KEY,
      'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.rating,places.userRatingCount,places.googleMapsUri,places.photos'
    },
    body: JSON.stringify({ textQuery: query, languageCode: 'ja', regionCode: 'JP', maxResultCount: 20 })
  }).then(r => r.json()).catch(() => ({ places: [] }));

  try {
    const results = await Promise.all(selectedQueries.map(fetchOne));

    // 結果を合体・重複除去・フィルタリング
    const seen = new Set();
    const allPlaces = [];
    for (const data of results) {
      for (const p of (data.places || [])) {
        const name = p.displayName?.text;
        if (name && !seen.has(name) && (p.rating || 0) >= 4.0 && (p.userRatingCount || 0) >= 500) {
          seen.add(name);
          allPlaces.push(p);
        }
      }
    }

    if (allPlaces.length === 0) {
      resultDiv.innerHTML = '<div class="search-loading">条件に合うお店が見つかりませんでした。シャッフルを試してください。</div>';
      return;
    }

    const picked = allPlaces.sort(() => Math.random() - 0.5).slice(0, 5);
    renderRecommendResults(picked);
  } catch (err) {
    resultDiv.innerHTML = '<div class="search-loading">エラーが発生しました。シャッフルを試してください。</div>';
    console.error(err);
  }
}

function renderRecommendResults(places) {
  const resultDiv = document.getElementById('recommend-results');
  const list = document.createElement('div');
  list.className = 'search-results-list';

  places.forEach(place => {
    const name = place.displayName?.text || '不明';
    const address = place.formattedAddress || '';
    const mapsUri = place.googleMapsUri || '';
    const photos = place.photos || [];

    const itemEl = document.createElement('div');
    itemEl.className = 'search-result-item';
    if (mapsUri) itemEl.onclick = () => window.open(mapsUri, '_blank');

    const photoEl = document.createElement('div');
    if (photos.length > 0) {
      photoEl.className = 'search-result-photos';
      photos.slice(0, 5).forEach(photo => {
        const img = document.createElement('img');
        img.src = `https://places.googleapis.com/v1/${photo.name}/media?maxHeightPx=200&maxWidthPx=240&key=${PLACES_API_KEY}`;
        img.alt = name;
        photoEl.appendChild(img);
      });
    } else {
      photoEl.className = 'search-result-no-photo';
      photoEl.textContent = '🍽';
    }

    const bodyEl = document.createElement('div');
    bodyEl.className = 'search-result-body';

    const info = document.createElement('div');
    info.className = 'search-result-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'search-result-name';
    nameEl.textContent = name;

    const addrEl = document.createElement('div');
    addrEl.className = 'search-result-addr';
    addrEl.textContent = address;

    const ratingEl = document.createElement('div');
    ratingEl.className = 'search-result-rating';
    ratingEl.textContent = place.rating ? `⭐ ${place.rating.toFixed(1)}（${place.userRatingCount}件）` : '';

    info.appendChild(nameEl);
    info.appendChild(addrEl);
    info.appendChild(ratingEl);

    const btn = document.createElement('button');
    btn.className = 'action-btn';
    const alreadyAdded = items.some(i => i.name === name);
    if (alreadyAdded) {
      btn.textContent = '✓ 追加済み';
      btn.disabled = true;
      btn.style.color = 'var(--visited)';
      btn.style.borderColor = 'var(--visited)';
    } else {
      btn.textContent = '＋ 追加';
      btn.onclick = (e) => {
        e.stopPropagation();
        addFromSearch(name, address, '', place.photos || []);
        btn.textContent = '✓ 追加済み';
        btn.disabled = true;
        btn.style.color = 'var(--visited-color)';
        btn.style.borderColor = 'var(--visited-color)';
      };
    }

    bodyEl.appendChild(info);
    bodyEl.appendChild(btn);
    itemEl.appendChild(photoEl);
    itemEl.appendChild(bodyEl);
    list.appendChild(itemEl);
  });

  resultDiv.innerHTML = '';
  resultDiv.appendChild(list);
}

function openSearch() {
  document.getElementById('s-area').value = '';
  document.getElementById('s-genre').value = '';
  document.getElementById('search-results').innerHTML = '';
  openModal('search-modal');
}

async function searchPlaces() {
  const area = document.getElementById('s-area').value.trim();
  const genre = document.getElementById('s-genre').value.trim();
  if (!area && !genre) { alert('エリアまたはジャンルを入力してください'); return; }

  const query = [genre, area].filter(Boolean).join(' ');
  const resultDiv = document.getElementById('search-results');
  resultDiv.innerHTML = '<div class="search-loading">🔍 検索中...</div>';

  try {
    const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': PLACES_API_KEY,
        'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.rating,places.userRatingCount,places.googleMapsUri,places.photos'
      },
      body: JSON.stringify({
        textQuery: query,
        languageCode: 'ja',
        regionCode: 'JP',
        maxResultCount: 20
      })
    });

    const data = await res.json();

    if (!data.places || data.places.length === 0) {
      resultDiv.innerHTML = '<div class="search-loading">見つかりませんでした。キーワードを変えてお試しください。</div>';
      return;
    }

    const sorted = data.places.slice().sort((a, b) => (b.rating || 0) - (a.rating || 0));
    renderSearchResults(sorted, genre, area);
  } catch (err) {
    resultDiv.innerHTML = `<div class="search-loading">エラーが発生しました。しばらくしてから再試行してください。</div>`;
    console.error(err);
  }
}

function renderSearchResults(places, genre, area) {
  const resultDiv = document.getElementById('search-results');
  const list = document.createElement('div');
  list.className = 'search-results-list';

  places.forEach(place => {
    const name = place.displayName?.text || '不明';
    const address = place.formattedAddress || '';
    const mapsUri = place.googleMapsUri || '';

    const itemEl = document.createElement('div');
    itemEl.className = 'search-result-item';
    if (mapsUri) itemEl.onclick = () => window.open(mapsUri, '_blank');

    // 写真（最大5枚横並び）
    const photos = place.photos || [];
    const photoEl = document.createElement('div');
    if (photos.length > 0) {
      photoEl.className = 'search-result-photos';
      photos.slice(0, 5).forEach(photo => {
        const url = `https://places.googleapis.com/v1/${photo.name}/media?maxHeightPx=200&maxWidthPx=240&key=${PLACES_API_KEY}`;
        const img = document.createElement('img');
        img.src = url;
        img.alt = name;
        photoEl.appendChild(img);
      });
    } else {
      photoEl.className = 'search-result-no-photo';
      photoEl.textContent = '🍽';
    }

    // ボディ
    const bodyEl = document.createElement('div');
    bodyEl.className = 'search-result-body';

    const info = document.createElement('div');
    info.className = 'search-result-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'search-result-name';
    nameEl.textContent = name;

    const addrEl = document.createElement('div');
    addrEl.className = 'search-result-addr';
    addrEl.textContent = address;

    const ratingEl = document.createElement('div');
    ratingEl.className = 'search-result-rating';
    const rating = place.rating;
    const count = place.userRatingCount;
    ratingEl.textContent = rating ? `⭐ ${rating.toFixed(1)}（${count}件）` : '評価なし';

    info.appendChild(nameEl);
    info.appendChild(addrEl);
    info.appendChild(ratingEl);

    const btn = document.createElement('button');
    btn.className = 'action-btn';
    const alreadyAdded = items.some(i => i.name === name);
    if (alreadyAdded) {
      btn.textContent = '✓ 追加済み';
      btn.disabled = true;
      btn.style.color = 'var(--visited)';
      btn.style.borderColor = 'var(--visited)';
    } else {
      btn.textContent = '＋ 追加';
      btn.onclick = (e) => {
        e.stopPropagation();
        addFromSearch(name, address, genre, place.photos || []);
        btn.textContent = '✓ 追加済み';
        btn.disabled = true;
        btn.style.color = 'var(--visited-color)';
        btn.style.borderColor = 'var(--visited-color)';
      };
    }

    bodyEl.appendChild(info);
    bodyEl.appendChild(btn);
    itemEl.appendChild(photoEl);
    itemEl.appendChild(bodyEl);
    list.appendChild(itemEl);
  });

  resultDiv.innerHTML = '';
  resultDiv.appendChild(list);
}

function addFromSearch(name, address, genre, photos = []) {
  if (items.some(i => i.name === name)) {
    if (!confirm(`「${name}」はすでにリストにあります。追加しますか？`)) return;
  }
  const item = {
    id: Date.now().toString(),
    name,
    genre,
    area: address,
    status: 'unvisited',
    memo: '',
    createdAt: Date.now(),
    photoNames: photos.slice(0, 5).map(p => p.name)
  };
  items.unshift(item);
  persist();
  render();
}

function openMap(item) {
  const q = encodeURIComponent([item.name, item.area].filter(Boolean).join(' '));
  document.getElementById('map-title').textContent = item.name + ' の地図';
  document.getElementById('map-frame').src =
    `https://www.google.com/maps/embed/v1/search?key=AIzaSyDGFLpUvOVdsXCWrDlJ4Z9VuRJNKmuf-0s&q=${q}&language=ja`;
  openModal('map-modal');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = items.filter(i => {
    if (currentFilter === 'visited' && i.status !== 'visited') return false;
    if (currentFilter === 'unvisited' && i.status !== 'unvisited') return false;
    if (q && !`${i.name} ${i.genre} ${i.area}`.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('stat-total').textContent = items.length;
  document.getElementById('stat-visited').textContent = items.filter(i=>i.status==='visited').length;
  document.getElementById('stat-unvisited').textContent = items.filter(i=>i.status==='unvisited').length;

  const list = document.getElementById('list');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="icon">🍜</div>お店がまだありません<br>「＋ 手動で追加」か「🔍 お店を検索して追加」からどうぞ！</div>`;
    return;
  }

  list.innerHTML = filtered.map(item => `
    <div class="card ${item.status}">
      ${item.photoNames && item.photoNames.length > 0 ? `
        <div class="card-photos">
          ${item.photoNames.map(n => `<img src="https://places.googleapis.com/v1/${n}/media?maxHeightPx=220&maxWidthPx=280&key=${PLACES_API_KEY}" alt="" loading="lazy">`).join('')}
        </div>
      ` : ''}
      <div class="card-content">
      <div class="status-dot ${item.status}"></div>
      <div class="card-body">
        <div class="card-name">${esc(item.name)}</div>
        <div class="card-meta">
          ${item.genre ? `<span class="badge">🍴 ${esc(item.genre)}</span>` : ''}
          ${item.area ? `<span class="badge">📍 ${esc(item.area)}</span>` : ''}
          <span class="badge" style="color:${item.status==='visited'?'var(--visited-color)':'var(--unvisited-color)'}">
            ${item.status==='visited' ? '✓ 訪問済' : '⭐ 行きたい'}
          </span>
        </div>
        ${item.memo ? `<div class="card-memo">${esc(item.memo)}</div>` : ''}
      </div>
      <div class="card-actions">
        <button class="action-btn" onclick="toggleStatus('${item.id}')">
          ${item.status==='visited' ? '↩ 未訪問に戻す' : '✓ 訪問済にする'}
        </button>
        ${item.area || item.name ? `<button class="action-btn" onclick='openMap(${JSON.stringify(item)})'>🗺 地図</button>` : ''}
        <button class="action-btn" onclick="openEdit('${item.id}')">✏ 編集</button>
        <button class="action-btn del" onclick="deleteItem('${item.id}')">🗑 削除</button>
      </div>
      </div>
    </div>
  `).join('');
}

function esc(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
